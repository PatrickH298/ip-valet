# Example deployment of ip-valet: Postgres, the API server, the admin
# dashboard, the UniFi worker and the SSO web client. See deploy/README.md for
# the first start.
#
# Every setting is an environment variable. The required ones are set below;
# every optional one is listed commented out, with its default and what it
# does. A variable marked (secret) can instead be read from a file by adding
# _FILE to its name (for example IPVALET_DATABASE_URL_FILE), such as a Docker
# secret: each service shows the commented-out lines for that, and the
# secrets themselves are defined, commented out, at the end of this file.
#
# All services share the project's default network, so any container
# on it reaches the API directly at http://api:8080 (client and worker API)
# and http://api:8081 (admin API).

name: ip-valet

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # The role Postgres creates on first start (a superuser of this server).
      POSTGRES_USER: ipvalet
      # That role's password. Change it, here and in IPVALET_DATABASE_URL.
      POSTGRES_PASSWORD: change-me
      # Or read the password from a secret instead:
      # POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # secrets: [postgres_password]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ipvalet"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/patrickh298/ip-valet-api:main # built from main; pin a release tag once there is one
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Container hardening: no writable filesystem, no Linux capabilities, no
    # privilege escalation.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The user the API runs as, as uid:gid; set both numbers. Default: the
    # image's non-root user, 65532:65532. The API writes no files.
    # user: "65532:65532"
    environment:
      # (required, secret) Postgres connection string. If the database does
      # not exist, the API creates it, provided the role may create databases.
      IPVALET_DATABASE_URL: postgres://ipvalet:change-me@db:5432/ipvalet?sslmode=disable
      # IPVALET_DATABASE_URL_FILE: /run/secrets/ipvalet_database_url

      # ---- Optional; the values shown are the defaults ----
      # Size of the database connection pool; one more connection is held for LISTEN.
      # IPVALET_DB_MAX_CONNS: "10"
      # Address the client and worker API listens on (plain HTTP).
      # IPVALET_LISTEN_ADDR: ":8080"
      # Address the admin API (/v1/admin/*) listens on. Empty serves it on
      # IPVALET_LISTEN_ADDR instead.
      # IPVALET_ADMIN_LISTEN_ADDR: ":8081"
      # Address Prometheus metrics (/metrics) are served on. Empty turns them off.
      # IPVALET_METRICS_ADDR: ":9090"
      # (secret) An admin key accepted besides the keys in the database, in the
      # form ipv_<16 base32>_<52 base32>. Unset by default.
      # IPVALET_ADMIN_KEY: ""
      # IPVALET_ADMIN_KEY_FILE: /run/secrets/ipvalet_admin_key
      # Instead of IPVALET_ADMIN_KEY: only that key's hash, <keyid>:<sha256 hex>,
      # as printed by `ipvalet-api hash-key`. Unset by default.
      # IPVALET_ADMIN_KEY_HASH: ""
      # Longest TTL in the TTL rule seeded into each new realm (s, m, h or d units).
      # IPVALET_DEFAULT_TTL: 30d
      # Shortest IPv4 prefix length in the prefix rule seeded into each new realm.
      # IPVALET_DEFAULT_PREFIX_V4: "32"
      # Shortest IPv6 prefix length in the prefix rule seeded into each new realm.
      # IPVALET_DEFAULT_PREFIX_V6: "64"
      # Failed authentications allowed per client network (an IPv4 address or
      # an IPv6 /64) per minute before its requests get 429; 0 turns it off.
      # IPVALET_AUTH_FAILURES_PER_MINUTE: "10"
      # Peers whose X-Forwarded-For header names the client: * (every peer),
      # none (no peer; the connection's address is the client), or a
      # comma-separated list of IP addresses and CIDR prefixes.
      # IPVALET_TRUSTED_PROXIES: "*"
      # Event streams one key may hold open at once, per API instance.
      # IPVALET_MAX_STREAMS_PER_KEY: "4"
      # How long deleted or expired entries are kept before they are purged.
      # IPVALET_RETENTION_ENTRIES: 90d
      # How long audit log rows are kept.
      # IPVALET_RETENTION_AUDIT: 365d
      # How often the purge job runs.
      # IPVALET_PURGE_INTERVAL: 1h
      # Interval between keep-alive comments on event streams.
      # IPVALET_SSE_HEARTBEAT: 20s
      # How often client event streams look again for entries that expired.
      # IPVALET_CLIENT_EVENTS_RECHECK: 30s
      # Largest request body accepted, in bytes.
      # IPVALET_MAX_BODY_BYTES: "65536"
      # How long shutdown waits for requests in flight.
      # IPVALET_SHUTDOWN_TIMEOUT: 15s
      # Log level: debug, info, warn or error.
      # IPVALET_LOG_LEVEL: info
    # secrets: [ipvalet_database_url, ipvalet_admin_key]
    ports:
      - "8080:8080" # client and worker API
      - "8081:8081" # admin API
      # - "9090:9090" # Prometheus metrics

  dashboard:
    image: ghcr.io/patrickh298/ip-valet-dashboard:main # built from main; pin a release tag once there is one
    restart: unless-stopped
    depends_on: [api]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The user the dashboard runs as, as uid:gid; set both numbers. Default:
    # the image's non-root user, 65532:65532. Any user can write to a new
    # named volume; with a host folder instead, make this user its owner.
    # Before changing it on a volume already in use, see deploy/README.md.
    # user: "65532:65532"
    environment:
      # (required) URL of the API server's admin listener.
      IPVALET_DASHBOARD_API_URL: http://api:8081
      # (required, secret) The admin key the dashboard uses for every API call.
      # Create one with `ipvalet-api create-admin-key` (see deploy/README.md)
      # and paste it here; the dashboard does not start without it.
      IPVALET_DASHBOARD_API_KEY: ""
      # IPVALET_DASHBOARD_API_KEY_FILE: /run/secrets/dashboard_api_key

      # ---- Optional; the values shown are the defaults ----
      # Address the dashboard listens on (plain HTTP).
      # IPVALET_DASHBOARD_LISTEN_ADDR: ":8090"
      # Timeout for each call to the API server.
      # IPVALET_DASHBOARD_API_TIMEOUT: 10s
      # Writable directory that holds the dashboard's login (login.json).
      # IPVALET_DASHBOARD_DATA_DIR: /data
      # When session cookies are marked Secure: auto (when the browser reached
      # the dashboard over HTTPS), true (always; browsers then keep them only
      # over HTTPS and on localhost) or false (never).
      # IPVALET_DASHBOARD_SECURE_COOKIES: auto
      # Idle time that ends a sign-in session.
      # IPVALET_DASHBOARD_SESSION_IDLE: 30m
      # Longest a sign-in session lasts.
      # IPVALET_DASHBOARD_SESSION_MAX: 12h
      # Failed sign-ins allowed per client network per minute; 0 turns it off.
      # IPVALET_DASHBOARD_LOGIN_FAILURES_PER_MINUTE: "10"
      # Peers whose X-Forwarded-For and X-Forwarded-Proto headers are believed:
      # * (every peer), none, or a comma-separated list of IPs and CIDR prefixes.
      # IPVALET_DASHBOARD_TRUSTED_PROXIES: "*"
      # IANA time zone for the times pages show.
      # IPVALET_DASHBOARD_TIMEZONE: UTC
      # How long shutdown waits for requests in flight.
      # IPVALET_DASHBOARD_SHUTDOWN_TIMEOUT: 15s
      # Log level: debug, info, warn or error.
      # IPVALET_DASHBOARD_LOG_LEVEL: info
    # secrets: [dashboard_api_key]
    volumes:
      # The login (admin / admin until you change it on first sign-in).
      - dashboard-data:/data
    ports:
      - "8090:8090" # dashboard

  unifi:
    image: ghcr.io/patrickh298/ip-valet-unifi:main # built from main; pin a release tag once there is one
    restart: unless-stopped
    depends_on: [api]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The user the worker runs as, as uid:gid; set both numbers. Default: the
    # image's non-root user, 65532:65532. Any user can write to a new named
    # volume; with a host folder instead, make this user its owner.
    # user: "65532:65532"
    environment:
      # (required) URL of the ip-valet API's main listener (client and worker API).
      IPVALET_UNIFI_API_URL: http://api:8080
      # (required, secret) The worker's key. Create the worker in the dashboard
      # (Workers), subscribe it to what it should receive, create a key on its
      # page and paste it here; the worker does not start without it.
      IPVALET_UNIFI_API_KEY: ""
      # IPVALET_UNIFI_API_KEY_FILE: /run/secrets/unifi_worker_key
      # (required) The UniFi Network integration API. A local console:
      #   https://<console address>/proxy/network/integration
      # or the cloud connector:
      #   https://api.ui.com/v1/connector/consoles/<console id>/proxy/network/integration
      IPVALET_UNIFI_CONTROLLER_URL: https://192.168.1.1/proxy/network/integration
      # (required, secret) A UniFi API key (UniFi Network: Settings > Control
      # Plane > Integrations; cloud: unifi.ui.com > API). It can reach the whole
      # Network API, so give it to this worker only.
      IPVALET_UNIFI_CONTROLLER_KEY: ""
      # IPVALET_UNIFI_CONTROLLER_KEY_FILE: /run/secrets/unifi_controller_key
      # (at least one) Rules: IPVALET_UNIFI_RULE_<NAME>, each space-separated
      # key=value pairs; an entry goes into the lists of every rule that takes it.
      #   realm      the realm, by name (required; * is not allowed)
      #   user       a user name, or * for any (default *)
      #   group      a group name, or * for any (default *)
      #   family     ipv4, ipv6 or both (default both)
      #   addresses  public, private or both (default public)
      #   ipv4_list  the UniFi IPv4 list, by name or id, that receives matching IPv4 entries
      #   ipv6_list  the UniFi IPv6 list, by name or id, that receives matching IPv6 entries
      # Quote a value with spaces: user="Zoë Smith". The worker replaces the
      # contents of every list a rule names; lists named in no rule are untouched.
      IPVALET_UNIFI_RULE_DEFAULT: realm=default ipv4_list=ip-valet-v4 ipv6_list=ip-valet-v6
      # IPVALET_UNIFI_RULE_LAB: realm=default group=lab family=ipv4 addresses=private ipv4_list=ip-valet-lab

      # ---- Optional; the values shown are the defaults ----
      # The UniFi site, by name or id.
      # IPVALET_UNIFI_SITE: Default
      # Check the controller's TLS certificate. false accepts a local console's
      # self-signed certificate; it is refused for the cloud connector.
      # IPVALET_UNIFI_VERIFY_TLS: "true"
      # Create lists that rules name, by name, when they do not exist yet
      # (lists named by id are never created).
      # IPVALET_UNIFI_CREATE_LISTS: "true"
      # Broadest IPv4 prefix the worker applies; broader ones are rejected.
      # IPVALET_UNIFI_MIN_PREFIX_V4: "24"
      # Broadest IPv6 prefix the worker applies; broader ones are rejected.
      # IPVALET_UNIFI_MIN_PREFIX_V6: "48"
      # Sync at least this often, besides change signals and expiries.
      # IPVALET_UNIFI_SYNC_INTERVAL: 1m
      # Timeout for each request to the API or the controller.
      # IPVALET_UNIFI_TIMEOUT: 15s
      # Writable directory for the cached desired state, so entries still expire
      # on time while the API is down, across restarts too. Empty keeps it in memory.
      # IPVALET_UNIFI_DATA_DIR: /data
      # Name reported to the API, to tell processes sharing the worker's keys
      # apart. Default: the container's host name.
      # IPVALET_UNIFI_INSTANCE: ""
      # Log level: debug, info, warn or error.
      # IPVALET_UNIFI_LOG_LEVEL: info
    # secrets: [unifi_worker_key, unifi_controller_key]
    volumes:
      # The cached desired state.
      - unifi-data:/data

  sso-web:
    image: ghcr.io/patrickh298/ip-valet-sso-web:main # built from main; pin a release tag once there is one
    restart: unless-stopped
    depends_on: [api]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The user the site runs as, as uid:gid; set both numbers. Default: the
    # image's non-root user, 65532:65532. The site writes no files.
    # user: "65532:65532"
    environment:
      # (required) Where people reach this site. The IdP sends them back here.
      IPVALET_SSO_PUBLIC_URL: https://ip.example.com
      # (required) URL of the ip-valet API's main listener (client and worker API).
      IPVALET_SSO_API_URL: http://api:8080
      # (required, secret) A client key. Create a client in the dashboard
      # (Clients) bound to every realm the rules below name, create a key on
      # its page and paste it here; the site does not start without it.
      IPVALET_SSO_API_KEY: ""
      # IPVALET_SSO_API_KEY_FILE: /run/secrets/sso_web_key
      # (required) How people sign in: oidc (OpenID Connect) or saml.
      IPVALET_SSO_PROVIDER: oidc

      # -- OpenID Connect. Register a client at the IdP with the redirect URI
      # <IPVALET_SSO_PUBLIC_URL>/auth/callback.
      # (required) The IdP's issuer URL, exactly as the IdP writes it.
      IPVALET_SSO_OIDC_ISSUER: https://auth.example.com/application/o/ip-valet/
      # (required) The client id registered at the IdP.
      IPVALET_SSO_OIDC_CLIENT_ID: ip-valet
      # (secret) The client secret. Leave it empty for a public client (PKCE only).
      IPVALET_SSO_OIDC_CLIENT_SECRET: ""
      # IPVALET_SSO_OIDC_CLIENT_SECRET_FILE: /run/secrets/sso_web_oidc_secret
      # Scopes requested. Many IdPs send the groups claim only for "groups".
      # IPVALET_SSO_OIDC_SCOPES: openid profile email groups
      # Claim holding the user name. A dotted name reaches into nested claims.
      # IPVALET_SSO_OIDC_USERNAME_CLAIM: preferred_username
      # Claim holding the groups, from the ID token or else userinfo (for
      # example realm_access.roles for Keycloak realm roles).
      # IPVALET_SSO_OIDC_GROUPS_CLAIM: groups

      # -- SAML (IPVALET_SSO_PROVIDER: saml). Give the IdP this site's
      # metadata, at <IPVALET_SSO_PUBLIC_URL>/saml/metadata; responses are
      # posted to <IPVALET_SSO_PUBLIC_URL>/saml/acs.
      # (required, one of the two) The IdP's metadata, by URL or as a file.
      # IPVALET_SSO_SAML_IDP_METADATA_URL: https://auth.example.com/saml/metadata
      # IPVALET_SSO_SAML_IDP_METADATA_FILE: /run/secrets/sso_web_idp_metadata
      # This site's entity id. Default: <IPVALET_SSO_PUBLIC_URL>/saml/metadata.
      # IPVALET_SSO_SAML_ENTITY_ID: ""
      # Attribute holding the user name. Empty uses the subject's NameID.
      # IPVALET_SSO_SAML_USERNAME_ATTRIBUTE: ""
      # Attribute holding the groups, by Name or FriendlyName.
      # IPVALET_SSO_SAML_GROUPS_ATTRIBUTE: groups
      # (secret) A key pair for this site, PEM, to sign its requests and to
      # receive encrypted assertions. Without it requests are unsigned and
      # assertions must not be encrypted.
      # IPVALET_SSO_SAML_SP_KEY_FILE: /run/secrets/sso_web_saml_key
      # IPVALET_SSO_SAML_SP_CERT_FILE: /run/secrets/sso_web_saml_cert

      # (at least one) Rules: IPVALET_SSO_RULE_<NAME>, each space-separated
      # key=value pairs. A rule takes people by IdP user and group and sends
      # their addresses to one realm; people get every rule that takes them,
      # and someone no rule takes cannot sign in. Rules that send someone to
      # the same realm merge, and the most permissive wins: the longest
      # max_ttl and ttl, manual entry if any allows it, and the group of the
      # rule with the longest max_ttl.
      #   realm    the realm (required)
      #   user     an IdP user name, or * for any (default *)
      #   group    an IdP group, or * for any (default *)
      #   as       the group the entries carry in ip-valet (default: group;
      #            required when group is *)
      #   max_ttl  the longest a person may keep an address, or unlimited (required)
      #   ttl      how long one click keeps it (default: max_ttl)
      #   manual   yes lets people type in addresses as well (default no)
      # Quote a value with spaces: group="IT Staff".
      IPVALET_SSO_RULE_STAFF: group=staff realm=default max_ttl=12h
      # IPVALET_SSO_RULE_ADMINS: group=admins realm=default max_ttl=30d ttl=7d manual=yes

      # ---- Optional; the values shown are the defaults ----
      # Peers whose X-Forwarded-For and X-Forwarded-Proto headers are believed:
      # * (every peer), none, or a comma-separated list of IPs and CIDR prefixes.
      # WARNING: the address the site detects is what people register by one
      # click. While every peer is trusted, anyone who can reach this container
      # without going through your proxy can send X-Forwarded-For and register
      # any address, even without manual entry. Set your reverse proxy's
      # address or subnet, or none when there is no proxy. The site logs a
      # warning at start while this is unset.
      # IPVALET_SSO_TRUSTED_PROXIES: "*"
      # Hosts reachable over one address family only (a name with only an A
      # record, and one with only an AAAA record), sent by your proxy to this
      # site's /detect, or to IPVALET_SSO_DETECT_LISTEN_ADDR. The page asks them
      # for the address of the family its own connection did not use. Without
      # them, only the address of each person's own connection is detected.
      # IPVALET_SSO_DETECT_V4_URL: https://v4.ip.example.com/detect
      # IPVALET_SSO_DETECT_V6_URL: https://v6.ip.example.com/detect
      # A second listener that serves only address detection. Empty: none.
      # IPVALET_SSO_DETECT_LISTEN_ADDR: ":8092"
      # Address the site listens on (plain HTTP).
      # IPVALET_SSO_LISTEN_ADDR: ":8091"
      # The site's name, shown on its pages.
      # IPVALET_SSO_TITLE: ip-valet
      # Subnet offered first for a detected address, as a prefix length.
      # IPVALET_SSO_DEFAULT_SUBNET_V4: "32"
      # IPVALET_SSO_DEFAULT_SUBNET_V6: "64"
      # Widest subnet a person may register, as a prefix length: 24 allows /24
      # to /32. The realms' own prefix rules apply as well.
      # IPVALET_SSO_MAX_SUBNET_V4: "24"
      # IPVALET_SSO_MAX_SUBNET_V6: "48"
      # When session cookies are marked Secure: auto (when the browser reached
      # the site over HTTPS), true (always) or false (never).
      # IPVALET_SSO_SECURE_COOKIES: auto
      # Idle time that ends a session; the next visit signs in again.
      # IPVALET_SSO_SESSION_IDLE: 1h
      # Longest a session lasts.
      # IPVALET_SSO_SESSION_MAX: 12h
      # Where Sign out sends people, such as the IdP's own logout page.
      # Empty: a signed-out page.
      # IPVALET_SSO_LOGOUT_URL: ""
      # Timeout for each call to the API server.
      # IPVALET_SSO_API_TIMEOUT: 10s
      # IANA time zone for the times pages show.
      # IPVALET_SSO_TIMEZONE: UTC
      # How long shutdown waits for requests in flight.
      # IPVALET_SSO_SHUTDOWN_TIMEOUT: 15s
      # Log level: debug, info, warn or error.
      # IPVALET_SSO_LOG_LEVEL: info
    # secrets: [sso_web_key, sso_web_oidc_secret]
    ports:
      - "8091:8091" # the site
      # - "8092:8092" # address detection, with IPVALET_SSO_DETECT_LISTEN_ADDR

    # To also join a network that already exists, such as one shared with a
    # reverse proxy or another stack, list it on each service that needs it:
    # networks: [default, shared]

# networks:
#   shared:
#     external: true

volumes:
  db-data:
  dashboard-data:
  unifi-data:

# Secrets, for the *_FILE variables above. Each file holds one value; the
# containers read them as /run/secrets/<name>, so each file must be readable
# by the user its service runs as: uid 65532 for the API, the dashboard, the
# UniFi worker and sso-web (or the uid in their user: lines) and uid 999 for
# Postgres.
#
# secrets:
#   postgres_password:
#     file: ./secrets/postgres_password
#   ipvalet_database_url:
#     file: ./secrets/ipvalet_database_url
#   ipvalet_admin_key:
#     file: ./secrets/ipvalet_admin_key
#   dashboard_api_key:
#     file: ./secrets/dashboard_api_key
#   unifi_worker_key:
#     file: ./secrets/unifi_worker_key
#   unifi_controller_key:
#     file: ./secrets/unifi_controller_key
#   sso_web_key:
#     file: ./secrets/sso_web_key
#   sso_web_oidc_secret:
#     file: ./secrets/sso_web_oidc_secret
