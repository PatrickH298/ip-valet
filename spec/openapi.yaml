openapi: 3.1.0
info:
  title: ip-valet API
  version: 1.0.0
  summary: Keeps firewall allow-lists in sync with addresses that people register.
  description: |
    The contract between the ip-valet API server and the workers and clients
    that talk to it. All paths are under `/v1`; the protocol version is
    separate from component release versions.

    **Keys.** Every `/v1` request carries `Authorization: Bearer <key>`, where
    a key is `ipv_<keyid>_<secret>` (`^ipv_[a-z2-7]{16}_[a-z2-7]{52}$`). Each
    key has one kind: admin routes need an admin key, `/v1/worker/*` needs a
    worker key, and every other `/v1` route needs a client key. A missing,
    malformed, unknown, revoked or expired key is `401 unauthenticated`; a key
    of the wrong kind is `403 forbidden`.

    **Conventions.** JSON in and out, UTF-8, `snake_case` fields. A wildcard
    selector field is the string `"*"`. Timestamps are RFC 3339 in UTC.
    Durations use the TTL syntax: a positive integer with unit `s`, `m`, `h`
    or `d` (at most `3650d`), or `unlimited`. Unknown body fields and unknown
    query parameters are `400 invalid_request`. Every response carries
    `X-Request-Id`.

    **Lists** take `limit` (default 100, max 1000) and an opaque `cursor`, and
    return `{ "items": [...], "next_cursor": "..." | null }`.

    **Codes.** Clients act on `error.code`, never on `message`. Codes may be
    added in later versions; a code's meaning never changes.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: https://ip-valet.example.com
    description: Behind a TLS-terminating reverse proxy.
tags:
  - name: client
    description: Submit and manage entries; read their applied state. Client keys.
  - name: worker
    description: Fetch a target's desired state, receive change signals, report status. Worker keys.
  - name: admin
    description: Configuration, entries, health and audit. Admin keys.
  - name: health
    description: Liveness and readiness. No authentication.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness
      description: 200 whenever the process is serving.
      security: []
      responses:
        "200":
          description: The process is serving.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            text/plain:
              schema: { type: string, examples: ["ok\n"] }

  /readyz:
    get:
      tags: [health]
      operationId: readyz
      summary: Readiness
      description: 200 when `SELECT 1` succeeds within 2 s and the LISTEN connection is up; otherwise 503.
      security: []
      responses:
        "200":
          description: Ready.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            text/plain:
              schema: { type: string }
        "503":
          description: The database is unreachable or the LISTEN connection is down.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            text/plain:
              schema: { type: string }

  # ---------------------------------------------------------------- client

  /v1/submissions:
    post:
      tags: [client]
      operationId: createSubmission
      summary: Create or replace entries
      description: |
        Registers one prefix for one user in one or more groups: one entry per
        group, all or nothing. A re-submission of an existing (realm, user,
        group, prefix) replaces it in place: it keeps its id, its expiry becomes
        now plus the new TTL, and it takes the new submission id and a new
        revision. An expired entry is revived the same way.

        Each group is checked in this order, and reports only its first
        failure: client scope (`realm_not_allowed`, `user_not_allowed`,
        `group_not_allowed`), `invalid_prefix`, `no_subscriber`, `ip_denied`,
        `prefix_too_broad`, `ttl_exceeded`, `cap_exceeded`. If any group fails,
        nothing is written and the response is 422 listing every group.

        The prefix is normalised: an address without `/` gets /32 or /128,
        IPv4-mapped IPv6 becomes IPv4, and host bits are cleared. The response
        returns the canonical form.
      security: [{ clientKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionRequest" }
      responses:
        "201":
          description: Every entry was created or replaced.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422":
          description: At least one group failed a check; nothing was written.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionRejected" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/submissions/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [client]
      operationId: deleteSubmission
      summary: Delete every entry of a submission
      description: |
        Soft-deletes every live entry that still holds this submission id. 404
        when there is none, or when any of them lies outside the client's realms.
      security: [{ clientKey: [] }]
      responses:
        "200":
          description: The deleted entry ids.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: array
                    items: { $ref: "#/components/schemas/UUID" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/entries:
    get:
      tags: [client]
      operationId: listEntries
      summary: List entries in the client's realms
      description: |
        Ordered by creation time. Only live, unexpired entries unless
        `include_ended=true`. The `state` filter runs after state is computed,
        so a page may hold fewer than `limit` items while `next_cursor` is set.
      security: [{ clientKey: [] }]
      parameters:
        - $ref: "#/components/parameters/RealmFilter"
        - $ref: "#/components/parameters/UserFilter"
        - $ref: "#/components/parameters/GroupFilter"
        - $ref: "#/components/parameters/PrefixFilter"
        - $ref: "#/components/parameters/StateFilter"
        - $ref: "#/components/parameters/IncludeEnded"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of entries.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Entry" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/entries/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [client]
      operationId: getEntry
      summary: One entry with its applied state
      security: [{ clientKey: [] }]
      responses:
        "200":
          description: The entry.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [client]
      operationId: deleteEntry
      summary: Delete one entry
      description: Soft-deletes the entry. An entry that is already deleted, or outside the client's realms, is 404.
      security: [{ clientKey: [] }]
      responses:
        "200":
          description: The entry, usually in state `removing`.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/events:
    get:
      tags: [client]
      operationId: clientEvents
      summary: Entry state changes (Server-Sent Events)
      description: |
        On connect the server computes the state of every entry in the
        client's realms that is live or ended within the last 24 hours, and
        sends nothing for that baseline. It recomputes on every change
        notification, every status report and on a timer (default 30 s, which
        catches expiries), and sends one `entry` event per entry whose overall
        state changed:

        ```
        event: entry
        data: {"id":"…","state":"active"}

        ```

        A `: ping` comment is sent every 20 s by default. The stream ends when
        the server shuts down or the key is revoked; reconnect and re-read
        entries as needed.
      security: [{ clientKey: [] }]
      responses:
        "200":
          description: An event stream.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoCache" }
            X-Accel-Buffering: { $ref: "#/components/headers/NoBuffering" }
          content:
            text/event-stream:
              schema:
                type: string
                description: "`entry` events whose data is an EntryEvent object."
              x-event-data: { $ref: "#/components/schemas/EntryEvent" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ---------------------------------------------------------------- worker

  /v1/worker/desired-state:
    get:
      tags: [worker]
      operationId: getDesiredState
      summary: The target's desired state
      description: |
        One item per distinct prefix among the target's matching, unexpired,
        undeleted entries, limited to its families, ordered by prefix. When
        several entries share a prefix the item carries the latest expiry, or
        `null` if any is unlimited. `revision`, `generated_at` and the items
        come from one database snapshot.

        The `ETag` is a quoted hex SHA-256 over the families and the items
        only, so it changes only when this target's content changes. With a
        matching `If-None-Match` the response is 304 with no body; the
        `IPValet-Revision` and `IPValet-Generated-At` headers are present on
        both, and the worker reports status with those values.
      security: [{ workerKey: [] }]
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
          description: An ETag from an earlier response.
      responses:
        "200":
          description: The desired state.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            ETag: { $ref: "#/components/headers/ETag" }
            IPValet-Revision: { $ref: "#/components/headers/IPValetRevision" }
            IPValet-Generated-At: { $ref: "#/components/headers/IPValetGeneratedAt" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesiredState" }
        "304":
          description: Unchanged for this target since the given ETag.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            ETag: { $ref: "#/components/headers/ETag" }
            IPValet-Revision: { $ref: "#/components/headers/IPValetRevision" }
            IPValet-Generated-At: { $ref: "#/components/headers/IPValetGeneratedAt" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/worker/events:
    get:
      tags: [worker]
      operationId: workerEvents
      summary: Change signals (Server-Sent Events)
      description: |
        Sends one `changed` event immediately on connect, whatever
        `Last-Event-ID` says, and another whenever the global revision may
        have changed. Events can arrive more often than this target's state
        changes; fetch desired state with `If-None-Match` to absorb that.

        ```
        id: 1842
        event: changed
        data: {"revision":1842}

        ```

        A `: ping` comment is sent every 20 s by default. The stream ends when
        the server shuts down or the key is revoked; reconnect with backoff.
      security: [{ workerKey: [] }]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
          description: Accepted and ignored; the server always sends one event on connect.
      responses:
        "200":
          description: An event stream.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoCache" }
            X-Accel-Buffering: { $ref: "#/components/headers/NoBuffering" }
          content:
            text/event-stream:
              schema:
                type: string
                description: "`changed` events whose id is the revision and whose data is a ChangedEvent object."
              x-event-data: { $ref: "#/components/schemas/ChangedEvent" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/worker/status:
    post:
      tags: [worker]
      operationId: reportStatus
      summary: Report the applied revision, rejections or an error
      description: |
        Report success only when everything except the listed rejections is
        in place on the firewall; otherwise report an error.

        Every report sets `last_seen_at`, `last_worker_id` and
        `last_worker_version`. A success report whose revision is at least the
        stored `applied_revision` raises it, raises `applied_generated_at` to
        the reported `generated_at` (never lowering it) and replaces the
        target's rejections. A success report with an older revision is stale
        and changes nothing else. An error report records `last_error` and
        leaves the applied state alone. A report may be repeated as a heartbeat.
      security: [{ workerKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusReport" }
      responses:
        "200":
          description: The applied revision now stored.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [applied_revision]
                properties:
                  applied_revision: { type: integer, format: int64, minimum: 0 }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ---------------------------------------------------------------- admin: realms

  /v1/admin/realms:
    get:
      tags: [admin]
      operationId: listRealms
      summary: List realms
      security: [{ adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of realms, by name.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Realm" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [admin]
      operationId: createRealm
      summary: Create a realm and seed its default rules
      description: |
        Seeds, with user and group `*` and the description `seeded default`:
        IP rules 1–25 deny each reserved range (IPv4, then IPv6), 26–27 accept
        `0.0.0.0/0` and `::/0`; one prefix rule with the configured default
        lengths; one TTL rule with the configured default TTL; no cap rules.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/RealmName" }
      responses:
        "201":
          description: The realm.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Realm"
                  - $ref: "#/components/schemas/MutationExtras"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/admin/realms/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RealmName" }
    get:
      tags: [admin]
      operationId: getRealm
      summary: One realm
      security: [{ adminKey: [] }]
      responses:
        "200":
          description: The realm.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Realm" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [admin]
      operationId: deleteRealm
      summary: Delete a realm
      description: |
        Soft-deletes the realm's live entries (one revision bump; they read
        `removing` until each still-matching target confirms) and deletes its
        rules, client bindings and subscriptions, bumping
        `subscriptions_revision` on the affected targets. Needs no
        confirmation. A client left with no realm gets 403
        `realm_not_allowed` on every call.
      security: [{ adminKey: [] }]
      responses:
        "200":
          description: What was removed.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RealmDeleteResult"
                  - $ref: "#/components/schemas/MutationExtras"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ---------------------------------------------------------------- admin: rules

  /v1/admin/realms/{realm}/rules/{list}:
    parameters:
      - $ref: "#/components/parameters/RealmPath"
      - $ref: "#/components/parameters/ListPath"
    get:
      tags: [admin]
      operationId: listRules
      summary: A realm's rule list, in order
      security: [{ adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of rules, by position.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Rule" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [admin]
      operationId: createRule
      summary: Add a rule
      description: |
        Without `position` the rule goes immediately before the list's first
        catch-all (user and group `*`, and for IP rules a `/0` prefix), or at
        the end. Goes through the impact check.
      security: [{ adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Confirm"
        - $ref: "#/components/parameters/OnExisting"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleCreate" }
      responses:
        "200":
          description: Dry run (`dry_run=true`); nothing was saved.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleMutation" }
        "201":
          description: The rule.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleMutation" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConfirmationRequired" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/admin/realms/{realm}/rules/{list}/order:
    parameters:
      - $ref: "#/components/parameters/RealmPath"
      - $ref: "#/components/parameters/ListPath"
    put:
      tags: [admin]
      operationId: reorderRules
      summary: Reorder a rule list
      description: "`ids` must list every rule in the list exactly once. Goes through the impact check."
      security: [{ adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Confirm"
        - $ref: "#/components/parameters/OnExisting"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids:
