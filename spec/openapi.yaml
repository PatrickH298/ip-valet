        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      tags: [admin]
      operationId: updateWorker
      summary: Change a worker
      description: |
        A change to `ipv4` or `ipv6` bumps the revision and the worker's
        `subscriptions_revision`, and goes through the impact check. Name and
        label changes do neither.
      security: [{ adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Confirm"
