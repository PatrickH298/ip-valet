        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [admin]
      operationId: createKey
      summary: Create a key
      description: The response holds the full key in `key`. It is shown only this once.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCreate" }
      responses:
        "201":
          description: The key record and, once, the full key.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Key"
                  - type: object
                    required: [key]
                    properties:
                      key:
                        type: string
                        pattern: "^ipv_[a-z2-7]{16}_[a-z2-7]{52}$"
                  - $ref: "#/components/schemas/MutationExtras"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
