    get:
      tags: [admin]
      operationId: getTarget
      summary: One target
      security: [{ adminKey: [] }]
      responses:
        "200":
          description: The target.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      tags: [admin]
      operationId: updateTarget
      summary: Change a target
      description: |
        A change to `ipv4` or `ipv6` bumps the revision and the target's
        `subscriptions_revision`, and goes through the impact check. Name and
        label changes do neither.
      security: [{ adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Confirm"
        - $ref: "#/components/parameters/OnExisting"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetPatch" }
      responses:
        "200":
          description: The target.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetMutation" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `confirmation_required` when the impact check found affected
            entries, or `conflict` when the name is taken.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [admin]
      operationId: deleteTarget
      summary: Delete a target
      description: Deletes its subscriptions, rejections and worker keys. Goes through the impact check.
      security: [{ adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Confirm"
        - $ref: "#/components/parameters/OnExisting"
      responses:
        "200":
          description: The deleted target.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetMutation" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConfirmationRequired" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/admin/targets/{id}/subscriptions:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [admin]
      operationId: listSubscriptions
      summary: A target's subscriptions
      security: [{ adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of subscriptions, by creation time.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Subscription" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [admin]
      operationId: createSubscription
      summary: Subscribe a target
      description: |
        Bumps the revision and the target's `subscriptions_revision`, so the
        group's existing entries read `pending` on this target until its
        worker catches up. Subscriptions are never edited: delete and create.
        A realm `*` with a specific user or group returns a
        `cross_realm_selector` warning.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionCreate" }
      responses:
        "201":
          description: The subscription.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionMutation" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/admin/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [admin]
      operationId: deleteSubscription
      summary: Delete a subscription
      description: Bumps the revision and the target's `subscriptions_revision`. Goes through the impact check.
      security: [{ adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/DryRun"
        - $ref: "#/components/parameters/Confirm"
        - $ref: "#/components/parameters/OnExisting"
      responses:
        "200":
          description: The deleted subscription.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionMutation" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConfirmationRequired" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

