# One always-running workflow. It works out which components changed, checks
# and tests those, and ends in the "CI summary" job, which is the only check
# the main branch ruleset should require (a required check that never runs
# would block merging).
#
# Components: api/, dashboard/ and workers/unifi/, each a Go module with its
# own image (ghcr.io/<owner>/ip-valet-api, -dashboard, -unifi) and release
# tags (<directory>/vX.Y.Z, for example workers/unifi/v0.1.0). The dashboard's
# and the worker's tests run against the API server built from api/, so an
# API change tests them too.
#
# Images: built on every pull request (not pushed), pushed to GHCR on every
# push to main, on release tags and weekly, so images pick up base-image
# fixes even when the code has not changed.
#
# Third-party code: only GitHub's own checkout and setup-go actions, pinned to
# commits; Go tools run with `go run` at fixed versions, verified by the Go
# checksum database.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["api/v*", "dashboard/v*", "workers/unifi/v*"]
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STATICCHECK_VERSION: v0.8.2 # 2026.2.2
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.detect.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Compare with the base
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all='[{"name":"api","dir":"api","image":"ip-valet-api"},
                {"name":"dashboard","dir":"dashboard","image":"ip-valet-dashboard"},
                {"name":"unifi","dir":"workers/unifi","image":"ip-valet-unifi"}]'
          # pick NAME... prints the components with those names, as JSON.
          pick() { jq -nc --argjson all "$all" '$all | map(select(.name as $n | $ARGS.positional | index($n)))' --args "$@"; }
          case "$REF" in
            refs/tags/api/v*) echo "components=$(pick api)" >> "$GITHUB_OUTPUT"; exit 0 ;;
            refs/tags/dashboard/v*) echo "components=$(pick dashboard)" >> "$GITHUB_OUTPUT"; exit 0 ;;
            refs/tags/workers/unifi/v*) echo "components=$(pick unifi)" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          range=""
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push)
              # Tags, new branches and force pushes rebuild everything.
              if [[ "$REF" == refs/heads/* ]] && [[ ! "$BEFORE" =~ ^0+$ ]] \
                && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range="$BEFORE..$SHA"
              fi
              ;;
          esac
          if [ -z "$range" ]; then
            echo "Event $EVENT on $REF: checking every component."
            echo "components=$(pick api dashboard unifi)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$range")"
          printf 'Changed files (%s):\n%s\n' "$range" "$files"
          names=()
          if grep -qE '^(api/|spec/|\.github/workflows/)' <<<"$files"; then names+=(api); fi
          if grep -qE '^(dashboard/|api/|spec/|\.github/workflows/)' <<<"$files"; then names+=(dashboard); fi
          if grep -qE '^(workers/unifi/|api/|spec/|\.github/workflows/)' <<<"$files"; then names+=(unifi); fi
          json="$(pick "${names[@]}")"
          echo "Components to check: $json"
          echo "components=$json" >> "$GITHUB_OUTPUT"

  dco:
    name: DCO sign-off
    # Dependency bots (Dependabot now, Renovate later) do not sign off.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit carries Signed-off-by
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for c in $(git rev-list --no-merges "$PR_BASE..$PR_HEAD"); do
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -q '[^[:space:]]'; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the Developer Certificate of Origin sign-off: git rebase --signoff $PR_BASE"
            exit 1
          fi
          echo "Every commit is signed off."

  test:
    name: Checks and tests (${{ matrix.component.name }})
    needs: changes
    if: needs.changes.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ matrix.component.dir }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      IPVALET_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.component.dir }}/go.mod
          # The dashboard's and the worker's tests build the API server too.
          cache-dependency-path: |
            ${{ matrix.component.dir }}/go.sum
            api/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Tests (Postgres, race detector)
        run: go test -race -count=1 ./...

  image:
    name: Image (${{ matrix.component.name }})
    needs: [changes, test]
    if: needs.changes.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out names and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          DIR: ${{ matrix.component.dir }}
          IMAGE_NAME: ${{ matrix.component.image }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/$IMAGE_NAME"
          short="${SHA:0:12}"
          push=false
          tags=""
          version="dev-$short"
          if [[ "$REF" == refs/tags/$DIR/v* ]]; then
            version="${REF#refs/tags/$DIR/v}"
            tags="$version latest"
            push=true
          elif [[ "$REF" == refs/heads/main ]] && [[ "$EVENT" != pull_request ]]; then
            tags="main sha-$short"
            push=true
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "tags=$tags"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ matrix.component.dir }}
        env:
          COMPONENT: ${{ matrix.component.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build --pull \
            --build-arg VERSION="$VERSION" --build-arg COMMIT="$SHA" --build-arg DATE="$date" \
            --label org.opencontainers.image.source="$SOURCE" \
            --label org.opencontainers.image.revision="$SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            -t "ip-valet-$COMPONENT:ci" .
      - name: Smoke test
        env:
          COMPONENT: ${{ matrix.component.name }}
        run: |
          set -euo pipefail
          image="ip-valet-$COMPONENT:ci"
          docker run --rm "$image" version
          test "$(docker inspect -f '{{.Config.User}}' "$image")" = "nonroot:nonroot"
          # Any uid:gid runs it (Compose user:), hardened as the example runs it.
          docker run --rm --user 12345:23456 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true "$image" version
          # A /data volume is writable by that user too: a new named volume
          # copies its owner and mode from the image.
          if docker inspect -f '{{json .Config.Volumes}}' "$image" | grep -q '"/data"'; then
            id="$(docker create "$image")"
            mode="$(docker export "$id" | tar -tvf - | awk '$NF == "data/" { print $1 }')"
            docker rm "$id" > /dev/null
            echo "/data: $mode"
            test "$mode" = drwxrwxrwx
          fi
      - name: Push to GHCR
        if: steps.meta.outputs.push == 'true'
        env:
          COMPONENT: ${{ matrix.component.name }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for tag in $TAGS; do
            docker tag "ip-valet-$COMPONENT:ci" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          docker logout ghcr.io

  summary:
    name: CI summary
    if: always()
    needs: [changes, dco, test, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
