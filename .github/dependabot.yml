# Weekly update pull requests for the API's Go modules, the pinned GitHub
# Actions and the image's base images. Interim: to be replaced by Renovate.
# Known vulnerabilities are caught independently by govulncheck in CI.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
