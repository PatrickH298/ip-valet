# Weekly update pull requests for the Go modules of the API server and the
# dashboard, the pinned GitHub Actions and the images' base images. Interim: to be replaced by Renovate.
# Known vulnerabilities are caught independently by govulncheck in CI.
version: 2
updates:
  - package-ecosystem: gomod
    directories: [/api, /dashboard]
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/api, /dashboard]
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
