# Weekly update pull requests for the Go modules of the API server, the
# dashboard, the UniFi worker and the SSO web client, the pinned GitHub
# Actions and the images' base images. Interim: to be replaced by Renovate.
# Known vulnerabilities are caught independently by govulncheck in CI.
version: 2
updates:
  - package-ecosystem: gomod
    directories: [/api, /dashboard, /workers/unifi, /clients/sso-web]
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/api, /dashboard, /workers/unifi, /clients/sso-web]
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
